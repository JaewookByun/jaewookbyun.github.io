<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매쓰고치 (Mathgotchi) - 스토어 이동 중...</title>
    
    <!-- SNS 공유 시 깔끔하게 노출되는 Open Graph 태그 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.chronolaboratory.com/go.html">
    <meta property="og:title" content="매쓰고치 - 우리아이 첫 수학·시계 공부방">
    <meta property="og:description" content="바늘을 직접 돌리는 시계 탐험과 손글씨 세로셈 연산! App Store & Google Play 무료 체험">
    <meta property="og:image" content="https://www.chronolaboratory.com/mathgotchi/icon_1024_white.png">

    <!-- 1. Google Analytics (GA4: G-DCW9DPCM02) 연동 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DCW9DPCM02"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-DCW9DPCM02');

        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) || 
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(ua);

            // 유입될 때 붙어온 UTM 꼬리표(?utm_source=...)를 그대로 유지하여 전달
            var queryParams = window.location.search;
            var defaultAndroidUtm = "?utm_source=smart_link&utm_medium=redirect&utm_campaign=mathgotchi";

            var targetPlatform = "web_pc";
            var targetUrl = "https://www.chronolaboratory.com/index-kr.html" + queryParams;

            if (isIOS) {
                targetPlatform = "ios_appstore";
                targetUrl = "https://apps.apple.com/us/app/mathgotchi-early-math-time/id6806621843"; // 정식 앱스토어 링크 적용
            } else if (isAndroid) {
                targetPlatform = "android_playstore";
                targetUrl = "https://play.google.com/store/apps/details?id=com.chronolab.wooagong" + 
                            (queryParams ? queryParams : defaultAndroidUtm);
            }

            var redirected = false;
            function doRedirect() {
                if (!redirected) {
                    redirected = true;
                    window.location.replace(targetUrl);
                }
            }

            // 안전장치: 네트워크 지연 시 최대 0.6초 뒤 강제 스토어 이동
            setTimeout(doRedirect, 600);

            // GA4에 플랫폼 유입 로그를 기록한 직후 리다이렉트 실행
            gtag('event', 'store_redirect', {
                'destination_platform': targetPlatform,
                'destination_url': targetUrl,
                'event_callback': doRedirect
            });
        })();
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #F8FAFC;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #6C5CE7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .manual-btn {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 20px;
            background-color: #6C5CE7;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div style="font-weight: 700; font-size: 16px;">매쓰고치 스토어로 이동 중입니다...</div>
    <div style="font-size: 13px; color: #64748B; margin-top: 6px;">잠시만 기다려 주세요.</div>
    
    <!-- 인앱 브라우저 등의 이유로 자동 이동이 지연될 때 수동으로 누를 수 있는 안전장치 버튼 -->
    <a href="https://www.chronolaboratory.com/index-kr.html" class="manual-btn" onclick="window.location.reload(); return false;">
        페이지가 안 넘어가면 여기를 누르세요
    </a>
</body>
</html>
