<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매쓰고치 (Mathgotchi) - 스토어 이동 중...</title>
    
    <!-- SNS 공유 시 깔끔하게 보이도록 OG 태그 설정 -->
    <meta property="og:title" content="매쓰고치 - 우리아이 첫 수학·시계 공부방">
    <meta property="og:description" content="바늘을 직접 돌리는 시계 탐험과 손글씨 세로셈 연산! App Store & Google Play 무료 체험">
    <meta property="og:url" content="https://www.chronolaboratory.com/go.html">

    <!-- 1. Google Analytics (GA4: G-DCW9DPCM02) 탑재 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DCW9DPCM02"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-DCW9DPCM02');

        (function() {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isIOS = (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) || 
                        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(ua);

            // 들어온 링크의 UTM 파라미터(예: ?utm_source=ig_ad)가 있다면 그대로 유지해서 전달
            var queryParams = window.location.search;
            var defaultAndroidUtm = "?utm_source=smart_link&utm_medium=redirect&utm_campaign=mathgotchi";

            var targetPlatform = "web_pc";
            var targetUrl = "https://www.chronolaboratory.com/index-kr.html" + queryParams;

            if (isIOS) {
                targetPlatform = "ios_appstore";
                targetUrl = "https://apps.apple.com/kr/app/id6806621843";
            } else if (isAndroid) {
                targetPlatform = "android_playstore";
                targetUrl = "https://play.google.com/store/apps/details?id=com.chronolab.wooagong";
            }

            var redirected = false;
            function doRedirect() {
                if (!redirected) {
                    redirected = true;
                    window.location.replace(targetUrl);
                }
            }

            // 2. 안전장치: 네트워크가 느려도 최대 0.6초 뒤에는 무조건 스토어로 이동
            setTimeout(doRedirect, 600);

            // 3. GA4에 어떤 OS 유저가 어느 스토어로 갔는지 기록 후 즉시 이동
            gtag('event', 'store_redirect', {
                'destination_platform': targetPlatform,
                'destination_url': targetUrl,
                'event_callback': doRedirect
            });
        })();
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            width: 36px;
            height: 36px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #6C5CE7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-manual {
            margin-top: 20px;
            font-size: 13px;
            color: #64748B;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div style="font-weight: 700; font-size: 16px;">매쓰고치 스토어로 이동 중입니다...</div>
    <div style="font-size: 13px; color: #64748B; margin-top: 6px;">잠시만 기다려 주세요.</div>
</body>
</html>
